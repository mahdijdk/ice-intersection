<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سامانه هشدار یخ‌زدگی مسیر</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; font-family: "Segoe UI", Tahoma, sans-serif; color: #eaf4fb; background: linear-gradient(160deg, #06121d 0%, #0d2a40 55%, #14405a 100%); --c: #8aa0b2; --tint: rgba(138,160,178,0.25); }
  body.s-safe { --c: #35d0a0; --tint: rgba(53,208,160,0.28); }
  body.s-warn { --c: #ffb020; --tint: rgba(255,176,32,0.3); }
  body.s-ice { --c: #ff4d4d; --tint: rgba(255,77,77,0.38); }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, transparent 55%, var(--tint) 100%); }
  body.s-ice::after { opacity: 1; animation: edge 1.4s ease-in-out infinite alternate; }
  @keyframes edge { from { opacity: 0.35; } to { opacity: 1; } }
  @keyframes beat { 50% { transform: scale(1.18); } }
  .bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px; padding: 12px 24px; background: rgba(0,0,0,0.3); border-width: 0 0 3px 0; border-style: solid; border-image: linear-gradient(90deg, #4fd1ff, #b48cff, #ff7ab6) 1; font-size: 22px; font-weight: 600; }
  .side1 { display: flex; align-items: center; gap: 10px; }
  .side2 { display: flex; align-items: center; justify-content: flex-end; gap: 14px; color: #9fc2d8; font-size: 16px; font-weight: 400; }
  .title { font-size: 24px; font-weight: 700; text-align: center; }
  .lbl { color: #9fc2d8; font-size: 18px; font-weight: 400; }
  .exit { font-family: inherit; font-size: 17px; color: #fff; background: rgba(255,77,77,0.25); border: 1px solid rgba(255,120,120,0.6); border-radius: 999px; padding: 6px 20px; cursor: pointer; }
  @media (max-width: 700px) { .bar { grid-template-columns: 1fr; text-align: center; } .side1, .side2 { justify-content: center; } }
  #dot { width: 14px; height: 14px; border-radius: 50%; background: var(--c); box-shadow: 0 0 12px var(--c); }
  #clock { font-size: 26px; letter-spacing: 1px; }
  .grid { flex: 1; display: grid; grid-template-columns: 1fr; gap: 18px; padding: 18px 24px 0 24px; }
  @media (min-width: 900px) { .grid { grid-template-columns: 1.3fr 1fr; } .wide { grid-column: 1 / -1; } }
  .panel { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 22px; padding: 18px; }
  .panel h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 10px 0; font-size: 20px; font-weight: 600; }
  .panel h2 i { width: 12px; height: 12px; border-radius: 4px; }
  .side { display: flex; flex-direction: column; gap: 18px; }
  #mapbox { position: relative; z-index: 0; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: #0f2437; }
  .pulse { transform-box: fill-box; transform-origin: center; animation: beat 1s infinite; }
  #alert { flex: 1; min-height: 220px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; border-color: var(--c); background: linear-gradient(135deg, var(--tint), rgba(255,255,255,0.04)); }
  #icon { font-size: 100px; line-height: 1; }
  body.s-ice #icon { animation: beat 1s infinite; }
  #msg { font-size: 40px; font-weight: 700; }
  #sub { font-size: 20px; margin-top: 4px; color: #dcecf7; }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 10px; font-size: 16px; color: #cfe3f1; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-left: 6px; }
  #risk { font-size: 34px; font-weight: 700; color: var(--c); margin-right: 8px; }
  #riskText { font-size: 18px; color: #cfe3f1; font-weight: 400; }
  .note { font-size: 14px; color: #9fc2d8; margin-top: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; padding: 18px 24px; }
  .chip { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); font-size: 17px; }
  .chip i { width: 12px; height: 12px; border-radius: 50%; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>

  <div class="title">سامانه هشدار یخ‌زدگی مسیر</div>
  <div class="side2"><span id="place"></span><span id="age"></span><button class="exit" onclick="exitApp()">خروج</button></div>
</div>

  s += '<circle cx="0" cy="0" r="11" fill="#0b1d2e" stroke="#fff" stroke-width="5"/>';
  for (const a of arms) {
    s += pinSvg(ARMS[a[0]], colors[a[1]], armIcons[a[1]], a[1] == 2);
  }
  s += pinSvg(DRIVER, "#4fd1ff", "🚗", false);
  document.getElementById("ov").innerHTML = s;
}

function exitApp() {
  window.close();
  setTimeout(function () { location.href = "about:blank"; }, 300);
}

function clamp(v) {
  return Math.max(0, Math.min(1, v));
}

function iceRisk(t, m) {
  return Math.round(clamp((4 - t) / 4) * clamp(m / 40) * 100);
}

function setState(cls, icon, msg, sub) {
  document.body.className = cls;
  document.getElementById("icon").textContent = icon;
  document.getElementById("msg").textContent = msg;
  document.getElementById("sub").textContent = sub;
}

function getStatus(s) {
  if (s.age > 30) {
    return 3;
  }
  return s.status;
}

function toPath(points) {
  let d = "";
  for (let i = 0; i < points.length; i++) {
    d = d + (i == 0 ? "M" : "L") + points[i][0].toFixed(1) + " " + points[i][1].toFixed(1) + " ";
  }
  return d;
}

function drawChart(history, color) {
  let points = [];
  for (const p of history) {
    if (p.a > 600) continue;
    points.push([40 + (1 - p.a / 600) * 550, 190 - iceRisk(p.t, p.m) * 1.8]);
  }
  let area = "";
  if (points.length > 1) {
    area = toPath(points) + "L" + points[points.length - 1][0].toFixed(1) + " 190 L" + points[0][0].toFixed(1) + " 190 Z";
  }
  document.getElementById("ch-area").setAttribute("d", area);
  document.getElementById("ch-area").setAttribute("fill", color);
  document.getElementById("ch-risk").setAttribute("d", toPath(points));
  document.getElementById("ch-risk").setAttribute("stroke", color);
}

async function update() {
  document.getElementById("clock").textContent = new Date().toLocaleTimeString("fa-IR", { hour: "2-digit", minute: "2-digit" });

  try {
    const res = await fetch("/data");
    const data = await res.json();
    const chips = document.getElementById("chips");
    chips.innerHTML = "";

    let arms = [];
    let iceList = [];
    let warnList = [];
    let offCount = 0;
    let total = 0;
    let minAge = null;
    let primary = null;
    let primaryRank = 0;

    for (const id in data) {
      const s = data[id];
      const st = getStatus(s);
      let label = s.place;
      total = total + 1;

      if (dirNames[s.direction]) {
        label = s.place + " - ورودی " + dirNames[s.direction];
        arms.push([s.direction, st]);
      }

      if (st == 2) {
        iceList.push(label);
      } else if (st == 1) {
        warnList.push(label);
      } else if (st == 3) {
        offCount = offCount + 1;
      }

      if (minAge == null || s.age < minAge) {
        minAge = s.age;
      }

      if (rank[st] > primaryRank) {
        primaryRank = rank[st];
        primary = s;
      }

      const chip = document.createElement("div");
      chip.className = "chip";
      const dot = document.createElement("i");
      dot.style.background = colors[st];
      const text = document.createElement("span");
      text.textContent = label + " | دما " + s.temp + "° | رطوبت " + s.moisture + "%";
      chip.appendChild(dot);
      chip.appendChild(text);
      chips.appendChild(chip);
    }

    drawArms(arms);

    let color = colors[3];
    if (primary != null) {
      const risk = iceRisk(primary.temp, primary.moisture);
      color = colors[getStatus(primary)];
      document.getElementById("place").textContent = primary.place;
      document.getElementById("risk").textContent = risk + "%";
      document.getElementById("riskText").textContent = risk < 34 ? "کم" : (risk < 67 ? "متوسط" : "زیاد");
      drawChart(primary.history || [], color);
    } else {
      document.getElementById("place").textContent = "";
      document.getElementById("risk").textContent = "--";
      document.getElementById("riskText").textContent = "";
      drawChart([], color);
    }

    if (minAge != null) {
      document.getElementById("age").textContent = "آخرین داده: " + minAge + " ثانیه پیش";
    }

    if (total == 0) {
      setState("s-off", "⏳", "در انتظار داده از سنسور", "");
    } else if (iceList.length > 0) {
      setState("s-ice", "❄️", "خطر! یخ‌زدگی", iceList.join("، "));
    } else if (warnList.length > 0) {
      setState("s-warn", "⚠️", "هشدار: احتمال یخ‌زدگی", warnList.join("، "));
    } else if (offCount > 0) {
      setState("s-off", "📡", "ارتباط " + offCount + " سنسور قطع است", "");
    } else {
      setState("s-safe", "✅", "مسیر امن است", "یخ‌زدگی‌ای گزارش نشده است");
    }
  } catch (e) {
    setState("s-off", "📡", "ارتباط با سرور قطع است", "اتصال شبکه را بررسی کنید");
  }
}

drawArms([]);
update();
setInterval(update, 3000);
</script>
